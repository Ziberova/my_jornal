<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>📚💰🍳🎬 RAW Hub</title><meta name="theme-color" content="#0f1115"><link rel="manifest" href="manifest.json"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><input type="file" id="importInput" style="display:none" accept=".json" onchange="importData(event)"><nav><button data-t="dash" class="on">🏠 Главная</button><button data-t="read">📚 Барахолка</button><button data-t="plan">📅 Планер</button><button data-t="media">🎬 Кино</button><button data-t="food">🍽 Кухня</button><button data-t="money">💱 Валюта</button><button data-t="wish">🛍 Желания</button><button data-t="notes">📝 Заметки</button><button id="themeBtn" style="flex:0;min-width:44px">🌓</button><button id="exportBtn" style="flex:0;min-width:44px" title="Экспорт">📤</button><button id="importBtn" style="flex:0;min-width:44px" title="Импорт">📥</button></nav><main><section id="dash" class="on"><h2>Твой дашборд</h2><div class="grid" id="dashGrid"></div></section><section id="read"><h2>Книжная барахолка</h2><div class="tabs"><button id="tab-diary" class="on" onclick="switchRead('diary')">📚 Дневник</button><button id="tab-lib" onclick="switchRead('lib')">📁 Библиотека</button></div><div id="read-diary"><div class="grid"><input id="rTitle" placeholder="Название книги"><input id="rAuthor" placeholder="Автор"></div><div class="row"><select id="rType"><option>Одиночка</option><option>Цикл</option><option>Дилогия</option></select><input id="rCycle" placeholder="Название цикла/дилогии"></div><div class="row"><input id="rGenre" placeholder="Жанр"><input id="rRate" type="number" min="0" max="10" placeholder="Оценка 0-10"></div><div class="row"><input id="rStart" type="date" title="Начало"><input id="rEnd" type="date" title="Окончание"></div><div class="row"><select id="rStatus"><option>Читаю</option><option>Прочитано</option><option>Хочу</option></select><input id="rPages" type="number" placeholder="Стр."><button class="act" onclick="addBook()">+</button></div><div id="rList"></div></div><div id="read-lib" style="display:none"><div id="libList"></div></div></section><section id="plan"><h2>Планер</h2><div class="row"><input id="pTask" placeholder="Что нужно сделать?"><input id="pDate" type="date"><button class="act" onclick="addTask()">+</button></div><div id="cal"></div><div id="pList"></div></section><section id="media"><h2>Фильмы и сериалы</h2><div class="row"><input id="mTitle" placeholder="Название фильма/сериала"><select id="mType"><option>Фильм</option><option>Сериал</option></select><button class="act" onclick="addMedia()">+</button></div><div class="chips" id="mFilter"></div><div id="mList"></div></section><section id="food"><h2>Изысканная кухня</h2><input id="fTitle" placeholder="Название блюда"><div class="grid"><input id="fTime" placeholder="Время (мин)"><input id="fServ" type="number" placeholder="Порций"></div><div class="grid"><select id="fWhere"><option>Сковородка</option><option>Духовка</option><option>Мультиварка</option><option>Без готовки</option></select><select id="fDiff"><option>Легко</option><option>Средне</option><option>Сложно</option></select></div><select id="fCat"><option>Завтрак</option><option>Обед</option><option>Ужин</option><option>Десерт</option></select><textarea id="fIng" rows="2" placeholder="Ингредиенты"></textarea><textarea id="fSteps" rows="3" placeholder="Шаги приготовления"></textarea><button class="act" onclick="addRecipe()">+</button><div class="chips" id="fFilter"></div><div id="fList"></div></section><section id="money"><h2>Семейная валюта</h2><div class="row"><input id="bDesc" placeholder="Описание"><input id="bSum" type="number" placeholder="Сумма"></div><div class="row"><select id="bType"><option>Расход</option><option>Доход</option></select><input id="bDate" type="date"><button class="act" onclick="addMoney()">+</button></div><div id="bTotal" class="card"></div><div id="bList"></div></section><section id="wish"><h2>Список желаний</h2><div class="row"><input id="wTitle" placeholder="Что хочется?"><input id="wPrice" type="number" placeholder="Цена"><button class="act" onclick="addWish()">+</button></div><div id="wList"></div></section><section id="notes"><h2>Заметки</h2><input id="nTitle" placeholder="Заголовок"><textarea id="nText" rows="4" placeholder="Текст заметки..."></textarea><button class="act" onclick="addNote()">+</button><div id="nList"></div></section></main><script src="app.js"></script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').then(reg=>console.log('SW OK')).catch(err=>console.log('SW Error',err))})}</script></body></html>
